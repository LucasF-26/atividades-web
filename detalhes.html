<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial Celeste - Detalhes do Ídolo</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="btn-voltar">← Voltar para a Galeria</a>
        </div>
    </header>

    <main class="container" id="detalhe-conteudo">
        <div class="detalhe-layout">
            
         
            <div class="coluna-perfil">
                <img id="idolo-foto" src="" alt="" class="foto-detalhe">
                <h2 id="idolo-nome">Carregando...</h2>
                <span id="idolo-posicao" class="badge-posicao"></span>
            </div>
            
         
            <div class="coluna-info">
                <div class="stats-box">
                    <h3>Ficha Técnica</h3>
                    <p><strong>Anos no clube:</strong> <span id="idolo-periodo"></span></p>
                    <p><strong>Partidas jogadas:</strong> <span id="idolo-jogos"></span></p>
                </div>
                
                <h3>Biografia</h3>
                <p id="idolo-biografia" class="texto-biografia"></p>

                <h3>Principais Títulos</h3>
                <ul id="idolo-titulos" class="lista-titulos"></ul>
            </div>

        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 - Memorial Celeste. Trabalho de Sistemas de Informação.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
