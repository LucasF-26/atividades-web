<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial Celeste - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h1>Eternos Ídolos do Cruzeiro</h1>
            <nav class="header-nav d-flex align-items-center gap-3">
                <a href="index.html" class="btn-nav">← Galeria</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <!-- Abas Login / Cadastro -->
                <ul class="nav nav-tabs mb-4" id="abas-auth">
                    <li class="nav-item">
                        <button class="nav-link active" id="aba-login-btn" onclick="mostrarAba('login')">🔑 Login</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="aba-cadastro-btn" onclick="mostrarAba('cadastro')">📝 Cadastrar</button>
                    </li>
                </ul>

                <!-- Alerta de feedback -->
                <div id="alerta-auth" class="alert d-none" role="alert"></div>

                <!-- Formulário de Login -->
                <div id="form-login" class="form-auth-box">
                    <h2 class="mb-4">Entrar na conta</h2>
                    <div class="mb-3">
                        <label for="login-usuario" class="form-label">Login</label>
                        <input type="text" class="form-control" id="login-usuario" placeholder="Seu login">
                    </div>
                    <div class="mb-4">
                        <label for="login-senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="login-senha" placeholder="Sua senha">
                    </div>
                    <button class="btn-submit w-100" onclick="fazerLogin()">Entrar</button>
                </div>

                <!-- Formulário de Cadastro -->
                <div id="form-cadastro" class="form-auth-box d-none">
                    <h2 class="mb-4">Criar conta</h2>
                    <div class="mb-3">
                        <label for="cad-nome" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="cad-nome" placeholder="Seu nome">
                    </div>
                    <div class="mb-3">
                        <label for="cad-email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="cad-email" placeholder="seu@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="cad-login" class="form-label">Login</label>
                        <input type="text" class="form-control" id="cad-login" placeholder="Escolha um login">
                    </div>
                    <div class="mb-4">
                        <label for="cad-senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="cad-senha" placeholder="Escolha uma senha">
                    </div>
                    <button class="btn-submit w-100" onclick="fazerCadastro()">Criar conta</button>
                </div>

            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-copy">
            <p class="mb-0">&copy; 2026 - Memorial Celeste. Trabalho de Sistemas de Informação.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
